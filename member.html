<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabinetim — Taxi Airport Tashkent</title>
<link rel="icon" type="image/png" href="favicon-tat-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cabinet.css">
</head>
<body>

<header class="cab-header">
  <div class="cab-nav">
    <a class="logo" href="index.html">
      <div>Taxi Airport<small>TASHKENT · 24/7</small></div>
    </a>
    <div class="cab-nav-right">
      <div class="lang-switch" id="langSwitch">
        <button type="button" class="lang-current" id="langCurrent">UZ <span>▾</span></button>
        <div class="lang-menu" id="langMenu">
          <button type="button" data-lang="uz">UZ — O'zbekcha</button>
          <button type="button" data-lang="en">EN — English</button>
          <button type="button" data-lang="tr">TR — Türkçe</button>
          <button type="button" data-lang="ru">RU — Русский</button>
          <button type="button" data-lang="ar">AR — العربية</button>
        </div>
      </div>
      <a href="index.html" class="btn btn-outline" data-i18n="nav.home">Bosh sahifa</a>
      <a href="admin.html" class="btn btn-outline" id="adminNavLink" style="display:none;" data-i18n="nav.admin">Admin panel</a>
      <button type="button" class="btn btn-danger-outline" id="logoutBtn" data-i18n="nav.logout">Chiqish</button>
    </div>
  </div>
</header>

<main class="container cab-wrap">

  <div class="cab-head">
    <div>
      <h1 id="greeting">Salom!</h1>
      <div class="sub" id="greetingEmail"></div>
    </div>
    <div class="bonus-pill">
      <span>🎁</span>
      <div>
        <b id="bonusAmount">0 so'm</b>
        <span data-i18n="member.bonusLabel">Bonus balansingiz</span>
      </div>
    </div>
  </div>

  <div class="cab-tabs">
    <button type="button" class="cab-tab-btn active" data-tab="new" data-i18n="member.tabNew">Yangi buyurtma</button>
    <button type="button" class="cab-tab-btn" data-tab="history" data-i18n="member.tabHistory">Buyurtmalar tarixi</button>
    <button type="button" class="cab-tab-btn" data-tab="profile" data-i18n="member.tabProfile">Profil</button>
  </div>

  <!-- YANGI BUYURTMA -->
  <section class="cab-panel active" id="panel-new">
    <div class="card">
      <h3 data-i18n="member.quickBookTitle">⚡ Tezkor buyurtma</h3>
      <form id="bookingForm" class="qb-grid">
        <div class="field">
          <label data-i18n="qb.labelName">Ism-Familiya</label>
          <input type="text" id="bkName" required>
        </div>
        <div class="field">
          <label data-i18n="qb.labelDirection">Yo'nalish</label>
          <select id="bkDirection">
            <option value="Aeroportdan olib ketish" data-i18n="qb.optFromAirport">Aeroportdan olib ketish</option>
            <option value="Aeroportga eltish" data-i18n="qb.optToAirport">Aeroportga eltish</option>
          </select>
        </div>
        <div class="field" id="bkFlightField">
          <label data-i18n="qb.labelFlight">Reys raqami</label>
          <input type="text" id="bkFlight" placeholder="HY 123">
        </div>
        <div class="field">
          <label data-i18n="qb.labelAddress">Manzil</label>
          <input type="text" id="bkAddress" data-i18n-placeholder="qb.placeholderAddress" placeholder="Ko'cha, uy, mahalla" required>
        </div>
        <div class="field">
          <label data-i18n="qb.labelDate">Sana</label>
          <input type="text" id="bkDate" inputmode="numeric" maxlength="10" data-i18n-placeholder="qb.placeholderDate" placeholder="kun/oy/yil" required>
        </div>
        <div class="field">
          <label data-i18n="qb.labelTime">Vaqt</label>
          <input type="text" id="bkTime" inputmode="numeric" maxlength="5" data-i18n-placeholder="qb.placeholderTime" placeholder="soat:daqiqa" required>
        </div>
        <div class="field">
          <label data-i18n="qb.labelBaggage">Bagaj soni</label>
          <select id="bkBaggage">
            <option value="0">0</option>
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5+">5+</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="qb.labelCar">Mashina turi</label>
          <select id="bkCar">
            <option value="Comfort" data-i18n="qb.carComfort">Comfort</option>
            <option value="Business" data-i18n="qb.carBusiness">Business</option>
            <option value="VIP Minivan" data-i18n="qb.carVip">VIP Minivan</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="qb.labelPhone">Telefon</label>
          <input type="tel" id="bkPhone" placeholder="+998 33 140 28 01" required>
        </div>
        <div class="field">
          <label data-i18n="qb.labelSign">Ismli taxtacha bilan kutib olish</label>
          <select id="bkSign">
            <option value="Kerak emas" data-i18n="qb.signNo">Kerak emas</option>
            <option value="Ha" data-i18n="qb.signYes">Ha</option>
          </select>
        </div>
        <p class="form-status" id="bookingStatus" style="grid-column:1/-1;"></p>
        <div class="qb-actions">
          <button type="submit" class="btn btn-gold btn-block" id="bookingSubmit" data-i18n="qb.submit">Zayavkani yuborish</button>
        </div>
      </form>
    </div>
  </section>

  <!-- BUYURTMALAR TARIXI -->
  <section class="cab-panel" id="panel-history">
    <div class="card">
      <h3 data-i18n="member.historyTitle">Buyurtmalar tarixi</h3>
      <div class="booking-list" id="bookingList">
        <p class="empty-state" data-i18n="member.loading">Yuklanmoqda...</p>
      </div>
    </div>
  </section>

  <!-- PROFIL -->
  <section class="cab-panel" id="panel-profile">
    <div class="card">
      <h3 data-i18n="member.profileTitle">Profil ma'lumotlari</h3>
      <form id="profileForm">
        <div class="field">
          <label data-i18n="reg.labelName">Ism Familiya</label>
          <input type="text" id="pfName" required>
        </div>
        <div class="field">
          <label data-i18n="reg.labelPhone">Telefon</label>
          <input type="tel" id="pfPhone" required>
        </div>
        <div class="field">
          <label data-i18n="member.emailLocked">Email (o'zgartirib bo'lmaydi)</label>
          <input type="email" id="pfEmail" disabled>
        </div>
        <p class="form-status" id="profileStatus"></p>
        <button type="submit" class="btn btn-gold" id="profileSubmit" data-i18n="member.save">Saqlash</button>
      </form>
    </div>
  </section>

</main>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

  const T = initLangSwitcher(TRANSLATIONS);
  document.addEventListener('taxiLangChanged', () => {
    if (currentUser) loadBookings();
  });

  let currentUser = null;

  requireAuth(async (user) => {
    currentUser = user;
    document.getElementById('greeting').textContent = T.t('member.greetingPrefix') + (user.displayName || T.t('member.defaultName')) + T.t('member.greetingSuffix');
    document.getElementById('greetingEmail').textContent = user.email;
    if (await isAdminUser(user)) {
      document.getElementById('adminNavLink').style.display = '';
    }

    const profile = await getUserProfile(user.uid);
    if (profile) {
      document.getElementById('bonusAmount').textContent = (profile.bonus || 0).toLocaleString('ru-RU') + T.t('member.somSuffix');
      document.getElementById('pfName').value = profile.name || '';
      document.getElementById('pfPhone').value = profile.phone || '';
      document.getElementById('pfEmail').value = profile.email || user.email;
      document.getElementById('bkName').value = profile.name || '';
      document.getElementById('bkPhone').value = profile.phone || '';
    }

    loadBookings();
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await logoutUser();
    window.location.href = 'index.html';
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.cab-tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cab-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.cab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- Yo'nalishga qarab reys raqami maydonini ko'rsatish/yashirish ----------
  const bkDirectionEl = document.getElementById('bkDirection');
  const bkFlightField = document.getElementById('bkFlightField');
  function toggleFlightField() {
    bkFlightField.style.display = bkDirectionEl.value === 'Aeroportga eltish' ? 'none' : 'flex';
  }
  bkDirectionEl.addEventListener('change', toggleFlightField);
  toggleFlightField();

  // ---------- Sana/vaqt formatlash (index.html'dagi bilan bir xil) ----------
  const bkDateEl = document.getElementById('bkDate');
  const bkTimeEl = document.getElementById('bkTime');
  bkDateEl.addEventListener('input', () => {
    let v = bkDateEl.value.replace(/\D/g, '').slice(0, 8);
    let out = v.slice(0, 2);
    if (v.length >= 3) out += '/' + v.slice(2, 4);
    if (v.length >= 5) out += '/' + v.slice(4, 8);
    bkDateEl.value = out;
  });
  bkTimeEl.addEventListener('input', () => {
    let v = bkTimeEl.value.replace(/\D/g, '').slice(0, 4);
    let out = v.slice(0, 2);
    if (v.length >= 3) out += ':' + v.slice(2, 4);
    bkTimeEl.value = out;
  });
  const DATE_RE = /^([0-2]\d|3[01])\/(0\d|1[0-2])\/20\d{2}$/;
  const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

  // ---------- Google Sheets'ga ham yozish (bosh sahifadagi mehmon formasi bilan bir xil manzil) ----------
  const SHEET_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbwzafZ8KHGoiouMK63TM0XOpCB87MtnZblVaMQyk50Db2p-zIoXMFZ4c2GX3OTW7WvfEw/exec";

  function sendToSheet(payload) {
    // mode:'no-cors' bo'lgani uchun javobni o'qib bo'lmaydi — xatolik chiqsa ham
    // Firestore'ga yozish jarayoniga xalaqit bermasin deb try/catch bilan o'raymiz.
    try {
      fetch(SHEET_ENDPOINT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(() => {});
    } catch (e) {}
  }

  // ---------- Yangi buyurtma yuborish ----------
  const bookingForm = document.getElementById('bookingForm');
  const bookingStatus = document.getElementById('bookingStatus');
  const bookingSubmit = document.getElementById('bookingSubmit');

  bookingForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!bookingForm.reportValidity()) return;

    if (!DATE_RE.test(bkDateEl.value) || !TIME_RE.test(bkTimeEl.value)) {
      bookingStatus.textContent = T.t('member.dateTimeInvalid');
      bookingStatus.className = 'form-status error';
      return;
    }

    const payload = {
      name: document.getElementById('bkName').value,
      direction: bkDirectionEl.value,
      flight: document.getElementById('bkFlight').value,
      address: document.getElementById('bkAddress').value,
      date: bkDateEl.value,
      time: bkTimeEl.value,
      baggage: document.getElementById('bkBaggage').value,
      car: document.getElementById('bkCar').value,
      phone: document.getElementById('bkPhone').value,
      sign: document.getElementById('bkSign').value
    };

    bookingSubmit.disabled = true;
    bookingSubmit.textContent = T.t('member.sending');
    bookingStatus.textContent = '';

    try {
      await createBooking(currentUser.uid, currentUser.email, payload);
      sendToSheet(payload);
      bookingStatus.textContent = T.t('member.bookingSuccess');
      bookingStatus.className = 'form-status success';
      bookingForm.reset();
      toggleFlightField();
      const profile = await getUserProfile(currentUser.uid);
      document.getElementById('bonusAmount').textContent = (profile.bonus || 0).toLocaleString('ru-RU') + T.t('member.somSuffix');
      loadBookings();
    } catch (err) {
      bookingStatus.textContent = T.t('member.errorPrefix') + err.message;
      bookingStatus.className = 'form-status error';
    } finally {
      bookingSubmit.disabled = false;
      bookingSubmit.textContent = T.t('qb.submit');
    }
  });

  // ---------- Buyurtmalar tarixi ----------
  function statusLabelFor(status) {
    const map = {
      'yuborildi': 'member.statusYuborildi',
      'tasdiqlandi': 'member.statusTasdiqlandi',
      'bajarildi': 'member.statusBajarildi',
      'bekor': 'member.statusBekor'
    };
    return map[status] ? T.t(map[status]) : status;
  }

  async function loadBookings() {
    const listEl = document.getElementById('bookingList');
    try {
      const bookings = await getUserBookings(currentUser.uid);
      if (bookings.length === 0) {
        listEl.innerHTML = '<p class="empty-state">' + T.t('member.emptyBookings') + '</p>';
        return;
      }
      listEl.innerHTML = bookings.map(b => {
        const dt = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate().toLocaleString('uz-UZ') : '';
        const statusKey = (b.status || 'yuborildi').replace(' ', '');
        const statusLabel = statusLabelFor(b.status || 'yuborildi');
        const priceLabel = (b.price === null || b.price === undefined || b.price === '')
          ? T.t('member.pricePrefix') + T.t('member.priceUnset') : T.t('member.pricePrefix') + Number(b.price).toLocaleString('ru-RU') + T.t('member.somSuffix');
        const payBtn = b.paymentLink
          ? `<a href="${b.paymentLink}" target="_blank" rel="noopener" class="btn btn-gold" style="padding:8px 18px; font-size:12.5px; margin-left:10px;">${T.t('member.payBtn')}</a>`
          : '';
        return `<div class="booking-item">
          <div class="bi-main">
            <b>${b.direction || ''} — ${b.date || ''} ${b.time || ''}</b>
            <span>📍 ${b.address || ''}</span>
            <span>🚗 ${b.car || ''} · 🧳 ${b.baggage || ''} ${T.t('member.bagajUnit')}${b.flight ? ' · ✈️ ' + b.flight : ''}</span>
            <span>💰 ${priceLabel}${payBtn}</span>
            <span>${T.t('member.sentAt')}${dt}</span>
          </div>
          <span class="status-pill ${statusKey}">${statusLabel}</span>
        </div>`;
      }).join('');
    } catch (err) {
      listEl.innerHTML = '<p class="empty-state">' + T.t('member.loadErrorPrefix') + err.message + '</p>';
    }
  }

  // ---------- Profilni saqlash ----------
  const profileForm = document.getElementById('profileForm');
  const profileStatus = document.getElementById('profileStatus');
  const profileSubmit = document.getElementById('profileSubmit');

  profileForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    profileSubmit.disabled = true;
    profileStatus.textContent = '';
    try {
      const name = document.getElementById('pfName').value.trim();
      const phone = document.getElementById('pfPhone').value.trim();
      await updateUserProfile(currentUser.uid, { name, phone });
      document.getElementById('greeting').textContent = T.t('member.greetingPrefix') + name + T.t('member.greetingSuffix');
      profileStatus.textContent = T.t('member.saved');
      profileStatus.className = 'form-status success';
    } catch (err) {
      profileStatus.textContent = T.t('member.errorPrefix') + err.message;
      profileStatus.className = 'form-status error';
    } finally {
      profileSubmit.disabled = false;
    }
  });
</script>
</body>
</html>
